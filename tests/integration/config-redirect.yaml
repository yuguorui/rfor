debug: false
disable-ipv6: false
tcp-sniff-timeout: 0.5
redirect-listen: '[::]:15081'

traffic-intercept:
  mode: redirect
  local-traffic: true
  ports: ["18080-18084", "18443-18444"]
  tproxy-proxy-chain: rfor-it-redirect

outbounds:
  - name: PROXY
    url: socks5://198.18.0.30:1080

rules:
  - DOMAIN,split.test,DIRECT
  - DEFAULT,,PROXY
