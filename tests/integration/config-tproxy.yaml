debug: false
disable-ipv6: false
tcp-sniff-timeout: 0.5
tproxy-listen: '[::]:15080'
udp-enabled: false

traffic-intercept:
  mode: tproxy
  local-traffic: true
  ports: ["18080-18081", "18443-18444"]
  tproxy-proxy-chain: rfor-it-proxy
  tproxy-mark-chain: rfor-it-mark
  rule-table: 66

outbounds:
  - name: PROXY
    url: socks5://198.18.0.30:1080

rules:
  - DOMAIN,split.test,DIRECT
  - DEFAULT,,PROXY
